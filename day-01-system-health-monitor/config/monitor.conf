# =============================================================================
# System Health Monitor — Configuration
# Edit these values to match your environment
# =============================================================================

# ── CPU Thresholds (%) ────────────────────────────────────────────────────────
CPU_WARN_THRESHOLD=70      # Warning alert fires at this usage %
CPU_CRIT_THRESHOLD=90      # Critical alert fires at this usage %

# ── RAM Thresholds (%) ────────────────────────────────────────────────────────
RAM_WARN_THRESHOLD=70
RAM_CRIT_THRESHOLD=90

# ── Disk Thresholds (%) ───────────────────────────────────────────────────────
DISK_WARN_THRESHOLD=70
DISK_CRIT_THRESHOLD=90
DISK_MOUNT="/"             # Mount point to monitor

# ── Email Alerts ──────────────────────────────────────────────────────────────
ENABLE_EMAIL=false         # Set to "true" to send email alerts via mailutils
ALERT_EMAIL="you@example.com"

# ── Log Retention ─────────────────────────────────────────────────────────────
LOG_RETENTION_DAYS=7       # Delete logs older than this many days

# ── Services to Monitor ───────────────────────────────────────────────────────
# Add systemd service names you want checked. Leave empty to skip.
# Example: MONITORED_SERVICES=("nginx" "postgresql" "docker")
MONITORED_SERVICES=()
